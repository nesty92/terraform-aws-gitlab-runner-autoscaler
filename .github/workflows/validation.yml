---
name: Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

  validate:
    name: ${{ matrix.runtime.name }} ${{ matrix.runtime.version }} validate (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - "."
          - "examples/complete"
          - "examples/amd64-only"
        runtime:
          - { name: terraform, version: "1.9.0" }
          - { name: terraform, version: "1.10.4" }
          - { name: opentofu, version: "1.9.0" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        if: matrix.runtime.name == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.runtime.version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.runtime.name == 'opentofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.runtime.version }}
          tofu_wrapper: false

      - name: Init
        working-directory: ${{ matrix.directory }}
        run: |
          if [ "${{ matrix.runtime.name }}" = "opentofu" ]; then
            tofu init -backend=false
          else
            terraform init -backend=false
          fi

      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: |
          if [ "${{ matrix.runtime.name }}" = "opentofu" ]; then
            tofu validate
          else
            terraform validate
          fi

  test:
    name: OpenTofu test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.9.0"
          tofu_wrapper: false

      - name: Init
        run: tofu init -backend=false

      - name: Test
        run: tofu test

  tflint:
    name: TFLint (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - "."
          - "examples/complete"
          - "examples/amd64-only"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache TFLint plugin dir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.55.1

      - name: Init TFLint
        working-directory: ${{ matrix.directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"

      - name: Run TFLint
        working-directory: ${{ matrix.directory }}
        run: tflint --format compact --config "${GITHUB_WORKSPACE}/.tflint.hcl"
