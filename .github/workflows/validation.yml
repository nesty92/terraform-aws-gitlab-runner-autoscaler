---
name: Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

  validate:
    name: ${{ matrix.runtime.name }} ${{ matrix.runtime.version }} validate (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - "."
          - "examples/complete"
          - "examples/amd64-only"
        runtime:
          - { name: terraform, version: "1.9.0" }
          - { name: terraform, version: "1.10.4" }
          - { name: opentofu, version: "1.9.0" }
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Terraform
        if: matrix.runtime.name == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.runtime.version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.runtime.name == 'opentofu'
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
        with:
          tofu_version: ${{ matrix.runtime.version }}
          tofu_wrapper: false

      - name: Init
        working-directory: ${{ matrix.directory }}
        run: |
          if [ "${{ matrix.runtime.name }}" = "opentofu" ]; then
            tofu init -backend=false
          else
            terraform init -backend=false
          fi

      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: |
          if [ "${{ matrix.runtime.name }}" = "opentofu" ]; then
            tofu validate
          else
            terraform validate
          fi

  tflint:
    name: TFLint (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - "."
          - "examples/complete"
          - "examples/amd64-only"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache TFLint plugin dir
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
        with:
          tflint_version: v0.55.1

      - name: Init TFLint
        working-directory: ${{ matrix.directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"

      - name: Run TFLint
        working-directory: ${{ matrix.directory }}
        run: tflint --format compact --config "${GITHUB_WORKSPACE}/.tflint.hcl"
