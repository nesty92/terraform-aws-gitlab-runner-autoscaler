---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions
